; W4B settings to merge into <Project>/Config/DefaultEngine.ini (docs/UE_PIPELINE.md section 5).
; Tested with tools/unreal/pipeline/build_arena.py + verify_arena.py on UE 5.7.3 and 5.8.3.

[/Script/Engine.CollisionProfile]
; The First Person template already defines this channel; keep exactly one copy of the line.
+DefaultChannelResponses=(Channel=ECC_GameTraceChannel1,Name="Projectile",DefaultResponse=ECR_Block,bTraceType=False,bStaticObject=False)
; Arena cover (crates, low walls, sandbags, perimeter): blocks movement, bullets and sight.
+Profiles=(Name="W4BCover",CollisionEnabled=QueryAndPhysics,bCanModify=False,ObjectTypeName="WorldStatic",CustomResponses=,HelpMessage="W4B arena cover: blocks movement, bullets and sight")
; Barrels and trees: block movement only; bullets (Projectile), sight (Visibility) and the camera pass.
+Profiles=(Name="W4BBulletPass",CollisionEnabled=QueryAndPhysics,bCanModify=False,ObjectTypeName="WorldStatic",CustomResponses=((Channel="Projectile",Response=ECR_Ignore),(Channel="Visibility",Response=ECR_Ignore),(Channel="Camera",Response=ECR_Ignore)),HelpMessage="W4B arena: blocks movement; bullets and sight pass")

[/Script/NavigationSystem.RecastNavMesh]
; Build the bots' navmesh when the level starts, so headless-built levels never need a manual "Build Paths".
RuntimeGeneration=Dynamic

[ConsoleVariables]
; Imports from scripts must not open the Content Browser (crashes -run=pythonscript, see UE_PIPELINE.md section 6).
Interchange.FeatureFlags.Import.SyncToBrowser=0
