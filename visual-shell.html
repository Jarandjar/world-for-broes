<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>World 4 Bro's - Base Visual Structure Sandbox</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=MedievalSharp&family=Cinzel:wght@600;800;900&family=Alegreya+SC:wght@700&family=Crimson+Pro:wght@400;600;700&family=IM+Fell+English+SC&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/ui/visual-shell/visual-shell.css" />
</head>
<body>

  <!-- ======================================================================
       SIMULATOR TOOLBAR: Live Testing Strip for Claude's Output
       ====================================================================== -->
  <header id="simulator-toolbar">
    <div class="sim-brand">
      <span>🌲 WORLD 4 BRO'S</span>
      <span style="color:var(--muted-text); font-size:11px;">[Visual Structure Sandbox]</span>
    </div>

    <div class="sim-groups">
      <!-- Device Frame Toggle -->
      <div class="sim-group">
        <button id="sim-toggle-frame" class="sim-btn" title="Toggle 844x390 Mobile Landscape Frame">📱 Mobile: 844x390</button>
      </div>

      <!-- Mode Selector -->
      <div class="sim-group">
        <span class="sim-label">Mode:</span>
        <button id="sim-mode-onfoot" class="sim-btn sim-btn-mode active">🚶 On-Foot</button>
        <button id="sim-mode-driving" class="sim-btn sim-btn-mode">🚗 Driving</button>
        <button id="sim-mode-repair" class="sim-btn sim-btn-mode">🔧 Repair</button>
      </div>

      <!-- Day/Night Lighting Theme -->
      <div class="sim-group">
        <span class="sim-label">Atmosphere:</span>
        <button id="sim-theme-day" class="sim-btn sim-btn-theme active">☀️ Day</button>
        <button id="sim-theme-dusk" class="sim-btn sim-btn-theme">🌅 Dusk</button>
        <button id="sim-theme-night" class="sim-btn sim-btn-theme">🌙 Night</button>
        <button id="sim-theme-horde" class="sim-btn sim-btn-theme" style="color:#ff4444;">🚨 Horde</button>
      </div>

      <!-- Live Vitals Sliders -->
      <div class="sim-group">
        <div class="sim-slider-wrap" title="Simulate Health">
          <span>❤️</span>
          <input id="sim-slider-health" class="sim-slider" type="range" min="0" max="100" value="95" />
        </div>
        <div class="sim-slider-wrap" title="Simulate Hunger">
          <span>🍗</span>
          <input id="sim-slider-hunger" class="sim-slider" type="range" min="0" max="100" value="80" />
        </div>
        <div class="sim-slider-wrap" title="Simulate Sanity">
          <span>🧠</span>
          <input id="sim-slider-sanity" class="sim-slider" type="range" min="0" max="100" value="70" />
        </div>
        <div id="sim-wrap-speed" class="sim-slider-wrap" title="Simulate Speedometer" style="display:none;">
          <span>🏎️</span>
          <input id="sim-slider-speed" class="sim-slider" type="range" min="0" max="140" value="45" />
        </div>
      </div>

      <!-- Simulation Action Triggers -->
      <div class="sim-group">
        <button id="sim-btn-cycle-action" class="sim-btn" title="Cycle Action Prompts">🔄 Action</button>
        <button id="sim-btn-damage" class="sim-btn" title="Trigger Damage Flash & HP Drop">💥 Hit</button>
        <button id="sim-btn-comic-pop" class="sim-btn" title="Spawn Comic Sound Pop">🗯️ Pop</button>
      </div>
    </div>
  </header>

  <!-- ======================================================================
       VIEWPORT STAGE (Adapts to Desktop or Mobile Landscape 844x390)
       ====================================================================== -->
  <main id="preview-stage">
    <div id="game-viewport">

      <!-- 1. Background Diorama Simulation -->
      <div id="diorama-canvas-bg"></div>

      <!-- 2. Atmospheric & Post FX Overlays -->
      <div id="vignette-overlay"></div>
      <div id="damage-flash"></div>

      <!-- ==================================================================
           [CLAUDE_BASE_VISUAL_STRUCTURE_START]
           Paste or modify Claude AI's visual structure below
           ================================================================== -->
      <div id="app-visual-root">

        <!-- HUD Layer -->
        <div id="hud-container">
          <!-- Top-Left Status Banner -->
          <div class="hud-top-left">
            <div id="status-banner">
              <div>
                <div class="title-logo">WORLD 4 BRO'S</div>
                <div class="sub-info">2.5D POP-UP DIORAMA</div>
              </div>
              <span class="hud-pill">ZOMBIE OUTBREAK</span>
              <div class="hud-btn-group">
                <button class="hud-icon-btn" title="Dev Spawner [F1]">🛠️</button>
                <button class="hud-icon-btn" title="Animation Lab [F2]">🎬</button>
                <button class="hud-icon-btn" title="Play on Mobile">📱</button>
                <button class="hud-icon-btn" title="Settings">⚙️</button>
              </div>
            </div>
          </div>

          <!-- Top-Right DST Clock Dial & Vitals Triad -->
          <div class="hud-top-right">
            <!-- Vitals Cluster -->
            <div id="vitals-container">
              <!-- Health Meter -->
              <div class="vital-badge" id="vital-health" title="Health Points">
                <div class="vital-icon">❤️</div>
                <div class="vital-fill-wrap">
                  <div class="vital-fill" id="fill-health" style="width: 95%;"></div>
                </div>
                <span class="vital-val" id="val-health">95</span>
              </div>

              <!-- Hunger Meter -->
              <div class="vital-badge" id="vital-hunger" title="Hunger Level">
                <div class="vital-icon">🍗</div>
                <div class="vital-fill-wrap">
                  <div class="vital-fill" id="fill-hunger" style="width: 80%;"></div>
                </div>
                <span class="vital-val" id="val-hunger">80</span>
              </div>

              <!-- Sanity Meter -->
              <div class="vital-badge" id="vital-sanity" title="Sanity / Mental State">
                <div class="vital-icon">🧠</div>
                <div class="vital-fill-wrap">
                  <div class="vital-fill" id="fill-sanity" style="width: 70%;"></div>
                </div>
                <span class="vital-val" id="val-sanity">70</span>
              </div>

              <!-- Condition Chips -->
              <div class="condition-chips">
                <span class="condition-chip" title="Noise Ripple Level">🔊 Lv. 1</span>
                <span class="condition-chip" title="Weight Load">⚖️ 14/35kg</span>
                <span class="condition-chip" title="Infection Immunity">☣️ 0%</span>
              </div>
            </div>

            <!-- Don't Starve Style Clock Dial -->
            <div id="dst-clock" title="Day/Dusk/Night Clock Dial">
              <div class="clock-pie" id="clock-pie"></div>
              <div class="clock-hand" id="clock-hand"></div>
              <div class="clock-center">
                <span id="day-counter">DAY 1</span>
                <span id="time-phase">DAY</span>
              </div>
            </div>
          </div>

          <!-- Center Context Action Banner -->
          <div class="hud-center-action">
            <div id="action-prompt">
              <span class="key-hint">SPACE</span>
              <span id="action-text">Chop Pine Tree</span>
            </div>
            <div id="target-progress-bar">
              <div id="target-progress-fill"></div>
            </div>
          </div>

          <!-- Bottom Center Inventory Hotbar -->
          <div class="hud-bot-center">
            <div id="inventory-bar">
              <!-- Slot 1 -->
              <div class="inv-slot selected">
                <span class="slot-key">1</span>
                <span class="slot-icon">🪓</span>
                <span class="slot-count">1</span>
                <div class="slot-durability"><div class="slot-durability-fill" style="width:85%;"></div></div>
              </div>
              <!-- Slot 2 -->
              <div class="inv-slot">
                <span class="slot-key">2</span>
                <span class="slot-icon">⛏️</span>
                <span class="slot-count">1</span>
                <div class="slot-durability"><div class="slot-durability-fill" style="width:100%;"></div></div>
              </div>
              <!-- Slot 3 -->
              <div class="inv-slot">
                <span class="slot-key">3</span>
                <span class="slot-icon">🪵</span>
                <span class="slot-count">12</span>
              </div>
              <!-- Slot 4 -->
              <div class="inv-slot">
                <span class="slot-key">4</span>
                <span class="slot-icon">🪨</span>
                <span class="slot-count">8</span>
              </div>
              <!-- Slot 5 -->
              <div class="inv-slot">
                <span class="slot-key">5</span>
                <span class="slot-icon">🍗</span>
                <span class="slot-count">3</span>
              </div>
              <!-- Slot 6 -->
              <div class="inv-slot">
                <span class="slot-key">6</span>
                <span class="slot-icon">🔥</span>
                <span class="slot-count">2</span>
              </div>
              <!-- Slot 7 -->
              <div class="inv-slot">
                <span class="slot-key">7</span>
                <span class="slot-icon">🔧</span>
                <span class="slot-count">1</span>
                <div class="slot-durability"><div class="slot-durability-fill" style="width:60%;"></div></div>
              </div>
              <!-- Slot 8 -->
              <div class="inv-slot">
                <span class="slot-key">8</span>
                <span class="slot-icon">🩹</span>
                <span class="slot-count">2</span>
              </div>
            </div>
          </div>
        </div>

        <!-- Mobile Virtual Touch Controls Layer -->
        <div id="touch-controls-layer">
          <div id="touch-joystick-zone">
            <div id="touch-joystick-base">
              <div id="touch-joystick-knob"></div>
            </div>
          </div>

          <div id="touch-action-cluster">
            <div class="touch-utility-row">
              <button class="util-touch-btn" title="Rotate Left">↺</button>
              <button class="util-touch-btn" title="Eat Selected Food">🍖</button>
              <button class="util-touch-btn" title="Chat Bubble">💬</button>
              <button class="util-touch-btn" title="Rotate Right">↻</button>
            </div>
            <button id="btn-touch-action" class="primary-touch-btn" title="Hold to Interact">
              <span class="btn-icon">🪓</span>
              <span class="btn-label" id="touch-action-title">ACTION</span>
            </button>
          </div>
        </div>

        <!-- Driving Dashboard Layer (Artboard 2) -->
        <div id="driving-controls-layer" class="hidden">
          <div class="driving-dash-cluster">
            <div style="font-size:22px;">🚗</div>
            <div class="dash-speedometer">
              <span id="dash-speed-val" class="dash-speed-val">45</span>
              <span class="dash-speed-unit">km/h</span>
            </div>
            <div class="dash-gauges">
              <div class="dash-gauge-row">
                <span>FUEL</span>
                <div class="dash-gauge-track"><div id="dash-fuel-fill" class="dash-fuel-fill"></div></div>
              </div>
              <div class="dash-gauge-row">
                <span>DURABILITY</span>
                <div class="dash-gauge-track"><div id="dash-durability-fill" class="dash-durability-fill"></div></div>
              </div>
            </div>
          </div>

          <div class="driving-steering">
            <button class="steer-btn">◀</button>
            <button class="steer-btn">▶</button>
          </div>

          <div class="driving-pedals">
            <button class="pedal-btn brake">REVERSE</button>
            <button class="pedal-btn gas">GAS</button>
          </div>
        </div>

        <!-- Comic Pops & Audio Feedback Layer -->
        <div id="comic-pops-layer"></div>

      </div>
      <!-- ==================================================================
           [CLAUDE_BASE_VISUAL_STRUCTURE_END]
           ================================================================== -->

    </div>
  </main>

  <script type="module" src="/src/ui/visual-shell/visual-shell.ts"></script>
</body>
</html>
